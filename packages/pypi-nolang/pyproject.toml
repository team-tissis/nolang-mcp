[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nolang"
version = "0.0.1"
description = "Official launcher for NoLang (AI video generation, no-lang.com). In Claude Code or Codex, install the plugin instead: claude plugin install nolang --marketplace mvrks-inc/nolang-plugin"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Mavericks, inc."}]
keywords = ["nolang", "video", "ai-agent", "claude-code", "codex", "cli"]
dependencies = []

[project.urls]
Homepage = "https://no-lang.com"
Repository = "https://github.com/mvrks-inc/nolang-plugin"

[project.scripts]
nolang = "nolang:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nolang"]
